<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - MMI Lab, Tripura University</title>
    <meta name="description" content="Photo gallery from MMI Lab, Tripura University. Lab activities, research events, conferences, and team moments.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mmilab.tripurauniv.ac.in/gallery.html">
    <meta property="og:title" content="Gallery - MMI Lab, Tripura University">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ── Gallery Filter Tabs ── */
        .gallery-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--color-warm-border); margin-bottom: 40px; overflow-x: auto; }
        .gallery-tab {
            padding: 14px 24px; cursor: pointer; border: none; background: none;
            font-family: var(--font-body); font-weight: 600; font-size: 0.7rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--color-text-secondary); transition: var(--transition);
            border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap;
        }
        .gallery-tab:hover { color: var(--color-text); }
        .gallery-tab.active { color: var(--brand-orange); border-bottom-color: var(--brand-orange); }

        /* ── Masonry Grid ── */
        .gallery-grid {
            columns: 3; column-gap: 16px;
        }
        .gallery-item {
            break-inside: avoid; margin-bottom: 16px;
            border: var(--border-light); background: white;
            overflow: hidden; transition: var(--transition);
            cursor: pointer; position: relative;
        }
        .gallery-item:hover { border-color: var(--brand-orange); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .gallery-item img { width: 100%; display: block; }
        .gallery-caption {
            padding: 16px 20px;
        }
        .gallery-caption-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .gallery-caption-meta { font-size: 0.75rem; color: var(--color-text-secondary); }

        /* ── Lightbox ── */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.92); align-items: center; justify-content: center;
            padding: 40px;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
        .lightbox-close {
            position: absolute; top: 24px; right: 24px;
            background: none; border: 1px solid rgba(255,255,255,0.3);
            color: white; width: 44px; height: 44px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; transition: var(--transition);
        }
        .lightbox-close:hover { background: var(--brand-orange); border-color: var(--brand-orange); }
        .lightbox-caption {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.8); font-size: 0.85rem; text-align: center;
            max-width: 600px;
        }

        /* ── Empty State ── */
        .gallery-empty {
            text-align: center; padding: 80px 40px;
            border: 2px dashed var(--color-warm-border); background: white;
        }
        .gallery-empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
        .gallery-empty-text { color: var(--color-text-secondary); font-size: 1rem; max-width: 400px; margin: 0 auto; }

        /* ── Upload UI ── */
        .gallery-upload-bar {
            display: flex; align-items: center; justify-content: flex-end;
            margin-bottom: 20px; gap: 12px;
        }
        .gallery-upload-btn {
            padding: 10px 20px; border: 1px solid var(--brand-orange); background: var(--brand-orange);
            color: white; cursor: pointer; font-family: var(--font-body); font-size: 0.75rem;
            font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; transition: var(--transition);
        }
        .gallery-upload-btn:hover { background: var(--brand-orange-light, #d84315); }
        .gallery-upload-modal {
            display: none; position: fixed; inset: 0; z-index: 2500;
            background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 24px;
        }
        .gallery-upload-modal.active { display: flex; }
        .gallery-upload-form {
            background: white; border: 1px solid var(--color-warm-border); padding: 32px;
            max-width: 500px; width: 100%;
        }
        .gallery-upload-form h2 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 24px; }
        .guf-group { margin-bottom: 16px; }
        .guf-label { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 6px; }
        .guf-input, .guf-select {
            width: 100%; border: 1px solid var(--color-warm-border); padding: 10px 12px;
            font-family: var(--font-body); font-size: 0.9rem; outline: none;
        }
        .guf-input:focus, .guf-select:focus { border-color: var(--brand-orange); }
        .guf-preview { max-width: 100%; max-height: 200px; margin-top: 8px; display: none; border: 1px solid var(--color-warm-border); }
        .guf-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .guf-cancel {
            padding: 10px 20px; border: 1px solid var(--color-warm-border); background: white;
            cursor: pointer; font-family: var(--font-body); font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase; transition: var(--transition);
        }
        .guf-cancel:hover { border-color: var(--brand-orange); color: var(--brand-orange); }
        .gallery-delete-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(220,38,38,0.9); color: white;
            border: none; width: 28px; height: 28px; cursor: pointer; font-size: 1rem;
            display: none; align-items: center; justify-content: center; z-index: 10; border-radius: 3px;
        }
        .gallery-item:hover .gallery-delete-btn { display: flex; }

        @media (max-width: 1024px) { .gallery-grid { columns: 2; } }
        @media (max-width: 600px) {
            .gallery-grid { columns: 1; }
            .gallery-tab { padding: 10px 16px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <nav class="nav"><div class="container nav-inner"><a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="MMI Lab"></a><button class="nav-toggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 12 12" fill="none"><path d="M0.75 3H11.25" stroke="currentColor"/><path d="M0.75 6H11.25" stroke="currentColor"/><path d="M0.75 9H11.25" stroke="currentColor"/></svg></button><div class="nav-links"><a href="index.html" class="nav-link text-tag-s">Home</a><a href="research.html" class="nav-link text-tag-s">Research</a><a href="team.html" class="nav-link text-tag-s">Our Team</a><a href="publications.html" class="nav-link text-tag-s">Publications</a><a href="projects.html" class="nav-link text-tag-s">Projects</a><a href="gallery.html" class="nav-link text-tag-s active">Gallery</a><a href="login.html" class="nav-link text-tag-s">Scholar Login</a></div></div></nav>
    <div class="spacer-nav"></div>

    <!-- ═══ HERO ═══ -->
    <section class="hero-dark" style="padding: 80px 0 60px;">
        <div class="container" style="position: relative; z-index: 1;">
            <div class="accent-bar" style="margin-bottom: 24px;"></div>
            <h1 class="text-display">Gallery</h1>
            <div style="height: 24px;"></div>
            <p class="text-paragraph-l" style="max-width: 600px;">A glimpse into our laboratory, fieldwork, events, and the people behind the research.</p>
        </div>
    </section>

    <!-- ═══ GALLERY CONTENT ═══ -->
    <section class="section-warm">
        <div class="container">
            <div id="galleryUploadBar" class="gallery-upload-bar" style="display: none;">
                <button class="gallery-upload-btn" id="openUploadBtn">+ Upload Photo</button>
            </div>
            <div class="gallery-tabs">
                <button class="gallery-tab active" data-filter="all">All</button>
                <button class="gallery-tab" data-filter="lab">Lab & Equipment</button>
                <button class="gallery-tab" data-filter="fieldwork">Fieldwork</button>
                <button class="gallery-tab" data-filter="events">Events & Conferences</button>
                <button class="gallery-tab" data-filter="team">Team Moments</button>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <!-- Gallery items will be rendered by JS -->
            </div>
        </div>
    </section>

    <!-- ═══ UPLOAD MODAL ═══ -->
    <div class="gallery-upload-modal" id="uploadModal">
        <div class="gallery-upload-form">
            <h2>Upload Photo to Gallery</h2>
            <div class="guf-group">
                <label class="guf-label">Image File *</label>
                <input type="file" class="guf-input" id="uploadFile" accept="image/jpeg,image/png,image/gif,image/webp">
                <img class="guf-preview" id="uploadPreview" alt="Preview">
            </div>
            <div class="guf-group">
                <label class="guf-label">Title / Caption *</label>
                <input type="text" class="guf-input" id="uploadTitle" placeholder="e.g. PCR Setup in the Molecular Biology Suite">
            </div>
            <div class="guf-group">
                <label class="guf-label">Category *</label>
                <select class="guf-select" id="uploadCategory">
                    <option value="lab">Lab & Equipment</option>
                    <option value="fieldwork">Fieldwork</option>
                    <option value="events">Events & Conferences</option>
                    <option value="team" selected>Team Moments</option>
                </select>
            </div>
            <div id="uploadError" style="color: #dc2626; font-size: 0.85rem; display: none; margin-bottom: 12px;"></div>
            <div class="guf-actions">
                <button class="guf-cancel" id="cancelUploadBtn">Cancel</button>
                <button class="gallery-upload-btn" id="submitUploadBtn">Upload</button>
            </div>
        </div>
    </div>

    <!-- ═══ LIGHTBOX ═══ -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <footer class="footer"><div class="container"><div class="footer-cell" style="text-align: center; border: none;"><span class="text-tag-s">© 2026 MMI LAB · Tripura University<br><span style="color: var(--color-text-muted); display: inline-block; margin-top: 8px;">Site designed by Argajit Sarkar</span></span></div></div></footer>

    <script>
    // ── Auth check ──
    const token = localStorage.getItem('mmilab_token');
    const user = JSON.parse(localStorage.getItem('mmilab_user') || 'null');
    const isLoggedIn = !!(token && user);

    // ── Hardcoded fallback images (always shown) ──
    const STATIC_GALLERY = [
        { src: "assets/gallery/interns-2025.jpg", title: "Interns from NIT, Agartala and KIT, bhuvneshwar", category: "team", date: "2025", isStatic: true },
        { src: "assets/gallery/internship-mbb-zoology.jpg", title: "Internship Completion of Students from B.Sc Zoology from MBB Univeristy, Tripura", category: "events", date: "2025", isStatic: true },
    ];

    let allImages = [...STATIC_GALLERY];
    let currentFilter = 'all';

    const grid = document.getElementById('galleryGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    // ── Show upload bar for logged-in users ──
    if (isLoggedIn) {
        document.getElementById('galleryUploadBar').style.display = 'flex';
    }

    // ── Fetch images from API and merge with static ──
    async function loadGalleryImages() {
        try {
            const res = await fetch('/api/gallery');
            if (res.ok) {
                const apiImages = await res.json();
                const dynamicImages = apiImages.map(img => ({
                    id: img.id,
                    src: `/api/gallery/image/${img.filename}`,
                    title: img.title,
                    category: img.category,
                    date: new Date(img.uploaded_at).getFullYear().toString(),
                    uploadedBy: img.uploaded_by_name || '',
                    uploadedById: img.uploaded_by,
                    isStatic: false
                }));
                allImages = [...dynamicImages, ...STATIC_GALLERY];
            }
        } catch (e) { /* API unavailable, use static only */ }
        renderGallery(currentFilter);
    }

    function renderGallery(filter) {
        currentFilter = filter;
        const items = filter === 'all' ? allImages : allImages.filter(d => d.category === filter);

        if (items.length === 0) {
            grid.innerHTML = `<div class="gallery-empty">
                <div class="gallery-empty-icon">&#x1F4F7;</div>
                <div class="gallery-empty-text">
                    <strong>No photos in this category yet.</strong><br>
                    ${isLoggedIn ? 'Click <strong>+ Upload Photo</strong> above to add images.' : 'Lab photos, fieldwork images, and event snapshots will appear here.'}
                </div>
            </div>`;
            return;
        }

        const canDelete = isLoggedIn && user;
        grid.innerHTML = items.map(item => {
            const showDelete = canDelete && !item.isStatic && (user.role === 'pi' || item.uploadedById === user.id);
            return `
            <div class="gallery-item" data-src="${item.src}" data-title="${item.title}" data-category="${item.category}">
                ${showDelete ? `<button class="gallery-delete-btn" data-id="${item.id}" title="Delete photo">&#x2715;</button>` : ''}
                <img src="${item.src}" alt="${item.title}" loading="lazy">
                <div class="gallery-caption">
                    <div class="gallery-caption-title">${item.title}</div>
                    <div class="gallery-caption-meta">${item.date || ''} · ${item.category.charAt(0).toUpperCase() + item.category.slice(1)}${item.uploadedBy ? ' · by ' + item.uploadedBy : ''}</div>
                </div>
            </div>`;
        }).join('');

        // Lightbox click handlers
        grid.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if (e.target.closest('.gallery-delete-btn')) return;
                lightboxImg.src = item.dataset.src;
                lightboxCaption.textContent = item.dataset.title;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        // Delete handlers
        grid.querySelectorAll('.gallery-delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!confirm('Delete this photo from the gallery?')) return;
                try {
                    const res = await fetch(`/api/gallery/${btn.dataset.id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) { loadGalleryImages(); }
                    else { const d = await res.json(); alert(d.error || 'Delete failed'); }
                } catch (err) { alert('Error deleting image'); }
            });
        });
    }

    // ── Tab switching ──
    document.querySelectorAll('.gallery-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            renderGallery(this.dataset.filter);
        });
    });

    // ── Lightbox controls ──
    document.getElementById('lightboxClose').addEventListener('click', () => {
        lightbox.classList.remove('active'); document.body.style.overflow = '';
    });
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            lightbox.classList.remove('active'); document.body.style.overflow = '';
            uploadModal.classList.remove('active');
        }
    });

    // ── Upload Modal ──
    const uploadModal = document.getElementById('uploadModal');
    const uploadFile = document.getElementById('uploadFile');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadError = document.getElementById('uploadError');

    if (isLoggedIn) {
        document.getElementById('openUploadBtn').addEventListener('click', () => {
            uploadModal.classList.add('active');
            uploadError.style.display = 'none';
        });
        document.getElementById('cancelUploadBtn').addEventListener('click', () => {
            uploadModal.classList.remove('active');
            uploadFile.value = ''; uploadPreview.style.display = 'none';
            document.getElementById('uploadTitle').value = '';
        });
        uploadModal.addEventListener('click', (e) => {
            if (e.target === uploadModal) uploadModal.classList.remove('active');
        });

        // Image preview
        uploadFile.addEventListener('change', () => {
            if (uploadFile.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { uploadPreview.src = e.target.result; uploadPreview.style.display = 'block'; };
                reader.readAsDataURL(uploadFile.files[0]);
            } else { uploadPreview.style.display = 'none'; }
        });

        // Submit upload
        document.getElementById('submitUploadBtn').addEventListener('click', async () => {
            uploadError.style.display = 'none';
            const file = uploadFile.files[0];
            const title = document.getElementById('uploadTitle').value.trim();
            const category = document.getElementById('uploadCategory').value;

            if (!file) { uploadError.textContent = 'Please select an image file.'; uploadError.style.display = 'block'; return; }
            if (!title) { uploadError.textContent = 'Please enter a title.'; uploadError.style.display = 'block'; return; }

            const formData = new FormData();
            formData.append('image', file);
            formData.append('title', title);
            formData.append('category', category);

            const btn = document.getElementById('submitUploadBtn');
            btn.disabled = true; btn.textContent = 'Uploading...';

            try {
                const res = await fetch('/api/gallery', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Upload failed');

                uploadModal.classList.remove('active');
                uploadFile.value = ''; uploadPreview.style.display = 'none';
                document.getElementById('uploadTitle').value = '';
                loadGalleryImages();
            } catch (err) {
                uploadError.textContent = err.message; uploadError.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Upload';
            }
        });
    }

    // ── Initial load ──
    loadGalleryImages();
    </script>
    <script src="js/main.js"></script>
</body>
</html>
